name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment webhook
        run: |
          status_code=$(curl -sS -o /tmp/deploy-response.json -w "%{http_code}" \
            -X POST "https://www.heyowlsurf.com/deploy" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")

          cat /tmp/deploy-response.json

          if [ "$status_code" -ne 200 ]; then
            echo "Deployment webhook failed with status $status_code"
            exit 1
          fi
