name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment
        run: |
          echo "Calling deployment endpoint..."

          status_code=$(curl \
            --ipv4 \
            --connect-timeout 15 \
            --max-time 30 \
            -L \
            -sS \
            -o /tmp/deploy-response.json \
            -w "%{http_code}" \
            -X POST \
            "https://www.owlsurf.media/deploy" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")

          echo "HTTP Status: $status_code"

          cat /tmp/deploy-response.json || true

          if [ "$status_code" -ne 200 ]; then
            echo "Deployment webhook failed with status $status_code"
            exit 1
          fi
