  <style>
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(214 30% 6%);
      transition: opacity .6s ease-out, visibility .6s ease-out
    }

    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none
    }

    .preloader .pencil {
      display: block;
      width: 10em;
      height: 10em;
      font-size: 16px
    }

    .preloader .pencil__body1,
    .preloader .pencil__body2,
    .preloader .pencil__body3,
    .preloader .pencil__eraser,
    .preloader .pencil__eraser-skew,
    .preloader .pencil__point,
    .preloader .pencil__rotate,
    .preloader .pencil__stroke {
      animation-duration: 3s;
      animation-timing-function: linear;
      animation-iteration-count: infinite
    }

    .preloader .pencil__body1,
    .preloader .pencil__body2,
    .preloader .pencil__body3 {
      transform: rotate(-90deg)
    }

    .preloader .pencil__body1 {
      animation-name: pencilBody1
    }

    .preloader .pencil__body2 {
      animation-name: pencilBody2
    }

    .preloader .pencil__body3 {
      animation-name: pencilBody3
    }

    .preloader .pencil__eraser {
      animation-name: pencilEraser;
      transform: rotate(-90deg) translate(49px, 0)
    }

    .preloader .pencil__eraser-skew {
      animation-name: pencilEraserSkew;
      animation-timing-function: ease-in-out
    }

    .preloader .pencil__point {
      animation-name: pencilPoint;
      transform: rotate(-90deg) translate(49px, -30px)
    }

    .preloader .pencil__rotate {
      animation-name: pencilRotate
    }

    .preloader .pencil__stroke {
      animation-name: pencilStroke;
      transform: translate(100px, 100px) rotate(-113deg)
    }

    @keyframes pencilBody1 {

      from,
      to {
        stroke-dashoffset: 351.86;
        transform: rotate(-90deg)
      }

      50% {
        stroke-dashoffset: 150.8;
        transform: rotate(-225deg)
      }
    }

    @keyframes pencilBody2 {

      from,
      to {
        stroke-dashoffset: 406.84;
        transform: rotate(-90deg)
      }

      50% {
        stroke-dashoffset: 174.36;
        transform: rotate(-225deg)
      }
    }

    @keyframes pencilBody3 {

      from,
      to {
        stroke-dashoffset: 296.88;
        transform: rotate(-90deg)
      }

      50% {
        stroke-dashoffset: 127.23;
        transform: rotate(-225deg)
      }
    }

    @keyframes pencilEraser {

      from,
      to {
        transform: rotate(-45deg) translate(49px, 0)
      }

      50% {
        transform: rotate(0deg) translate(49px, 0)
      }
    }

    @keyframes pencilEraserSkew {

      from,
      32.5%,
      67.5%,
      to {
        transform: skewX(0)
      }

      35%,
      65% {
        transform: skewX(-4deg)
      }

      37.5%,
      62.5% {
        transform: skewX(8deg)
      }

      40%,
      45%,
      50%,
      55%,
      60% {
        transform: skewX(-15deg)
      }

      42.5%,
      47.5%,
      52.5%,
      57.5% {
        transform: skewX(15deg)
      }
    }

    @keyframes pencilPoint {

      from,
      to {
        transform: rotate(-90deg) translate(49px, -30px)
      }

      50% {
        transform: rotate(-225deg) translate(49px, -30px)
      }
    }

    @keyframes pencilRotate {
      from {
        transform: translate(100px, 100px) rotate(0)
      }

      to {
        transform: translate(100px, 100px) rotate(720deg)
      }
    }

    @keyframes pencilStroke {
      from {
        stroke-dashoffset: 439.82;
        transform: translate(100px, 100px) rotate(-113deg)
      }

      50% {
        stroke-dashoffset: 164.93;
        transform: translate(100px, 100px) rotate(-113deg)
      }

      75%,
      to {
        stroke-dashoffset: 439.82;
        transform: translate(100px, 100px) rotate(112deg)
      }
    }

    .preloader-text {
      color: hsl(180 45% 53%);
      font-family: Montserrat, sans-serif;
      font-size: 0.875rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 2rem
    }
  </style>
</head>

<body>
  <div id="preloader" class="preloader">
    <div style="display:flex;flex-direction:column;align-items:center">
      <svg xmlns="http://www.w3.org/2000/svg" height="200" width="200" viewBox="0 0 200 200" class="pencil">
        <defs>
          <clipPath id="pencil-eraser">
            <rect height="30" width="30" ry="5" rx="5" />
          </clipPath>
        </defs>
        <circle transform="rotate(-113,100,100)" stroke-linecap="round" stroke-dashoffset="439.82"
          stroke-dasharray="439.82 439.82" stroke-width="2" stroke="hsl(180 45% 53%)" fill="none" r="70"
          class="pencil__stroke" />
        <g transform="translate(100,100)" class="pencil__rotate">
          <g fill="none">
            <circle transform="rotate(-90)" stroke-dashoffset="402" stroke-dasharray="402.12 402.12" stroke-width="30"
              stroke="hsl(180 45% 50%)" r="64" class="pencil__body1" />
            <circle transform="rotate(-90)" stroke-dashoffset="465" stroke-dasharray="464.96 464.96" stroke-width="10"
              stroke="hsl(180 45% 60%)" r="74" class="pencil__body2" />
            <circle transform="rotate(-90)" stroke-dashoffset="339" stroke-dasharray="339.29 339.29" stroke-width="10"
              stroke="hsl(180 45% 40%)" r="54" class="pencil__body3" />
          </g>
          <g transform="rotate(-90) translate(49,0)" class="pencil__eraser">
            <g class="pencil__eraser-skew">
              <rect height="30" width="30" ry="5" rx="5" fill="hsl(180 45% 70%)" />
              <rect clip-path="url(#pencil-eraser)" height="30" width="5" fill="hsl(180 45% 60%)" />
              <rect height="20" width="30" fill="hsl(180 10% 90%)" />
              <rect height="20" width="15" fill="hsl(180 10% 70%)" />
              <rect height="20" width="5" fill="hsl(180 10% 80%)" />
              <rect height="2" width="30" y="6" fill="hsla(180,10%,10%,0.2)" />
              <rect height="2" width="30" y="13" fill="hsla(180,10%,10%,0.2)" />
            </g>
          </g>
          <g transform="rotate(-90) translate(49,-30)" class="pencil__point">
            <polygon points="15 0,30 30,0 30" fill="hsl(33 90% 70%)" />
            <polygon points="15 0,6 30,0 30" fill="hsl(33 90% 50%)" />
            <polygon points="15 0,20 10,10 10" fill="hsl(180 10% 10%)" />
          </g>
        </g>
      </svg>
      <p class="preloader-text">Loading...</p>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
